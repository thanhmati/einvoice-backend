name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  actions: read
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'dev'

      - name: Lint Affected
        run: npx nx affected -t lint

      - name: Test Affected
        run: npx nx affected -t test

      - name: Build Affected
        run: npx nx affected -t build

  build-push-deploy:
    needs: lint-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }} # e.g. docker.io/username
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'dev'

      - name: Make scripts executable
        run: chmod +x tools/deploy/*.sh

      - name: Build Affected
        run: npx nx affected -t build

      - name: Build and Push Docker Images
        run: ./tools/deploy/build-images.sh
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Affected Apps
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --type app --json | jq -r 'join(" ")')
          echo "AFFECTED_APPS=$AFFECTED" >> $GITHUB_ENV
          echo "Affected apps: $AFFECTED"

      - name: Prepare Deployment Files
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.provider.yaml,docker-compose.deploy.yml,docker,.env'
          target: '~/app/einvoice'
          rm: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        if: env.AFFECTED_APPS != ''
        env:
          AFFECTED_APPS: ${{ env.AFFECTED_APPS }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AFFECTED_APPS,DOCKER_REGISTRY,IMAGE_TAG
          script: |
            cd ~/app/einvoice

            echo "Ensuring providers are up..."
            docker compose -f docker-compose.provider.yaml up -d redis

            echo "Deploying applications: bff"
            docker compose -f docker-compose.deploy.yml pull bff
            docker compose -f docker-compose.deploy.yml up -d --no-deps bff

            # Cleanup .env if desired, but we usually keep it for debug or auto-restart
            # rm .env
