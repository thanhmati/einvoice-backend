syntax = "proto3";

package GRPC_AUTHORIZER_SERVICE;

import "user-access.proto";

service KeycloakService {
  rpc verifyUserToken (UserTokenRequest) returns (UserTokenResponse);
}

message UserTokenRequest {
  string token = 1;
  string processID = 2;
}

message JWTPayload {
  string iss = 1;
  string aud = 2;
  int32 iat = 3;
  int32 exp = 4;
  string sub = 5;
  string at_hash = 6;
  string sid = 7;
  string nonce = 8;
  bool isExpired = 9;
}

message AuthorizedMetadata {
  optional string userId = 1;
  optional User user = 2;
  repeated string permissions = 3;
  optional JWTPayload jwt = 4;
}

message AuthorizedResult {
  bool valid = 1;
  optional AuthorizedMetadata metadata = 2;
}

message UserTokenResponse {
  string code = 1;
  AuthorizedResult data = 2;
  string error = 3;
}

