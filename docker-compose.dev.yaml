name: invoice

networks:
  einvoice-nw:
    driver: bridge
    name: einvoice-nw
    external: true

services:
  invoice:
    container_name: invoice
    image: invoice:latest
    networks:
      - einvoice-nw

  pdf-generator:
    container_name: pdf-generator
    image: pdf-generator:latest
    networks:
      - einvoice-nw

  media:
    container_name: media
    image: media:latest
    networks:
      - einvoice-nw

  bff:
    container_name: bff
    image: bff:latest
    ports:
      - 3000:3000
    networks:
      - einvoice-nw
