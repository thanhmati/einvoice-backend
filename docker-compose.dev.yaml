name: einvoice-dev

networks:
  einvoice-nw:
    driver: bridge
    name: einvoice-nw
    external: true

services:
  invoice:
    container_name: invoice
    image: invoice:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  pdf-generator:
    container_name: pdf-generator
    image: pdf-generator:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  media:
    container_name: media
    image: media:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  mail:
    container_name: mail
    image: mail:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  user-access:
    container_name: user-access
    image: user-access:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  authorizer:
    container_name: authorizer
    image: authorizer:latest
    networks:
      - einvoice-nw
    env_file:
      - .env.prod

  bff:
    container_name: bff
    image: bff:latest
    ports:
      - 3300:3300
    networks:
      - einvoice-nw
    env_file:
      - .env.prod
